<!DOCTYPE html>
<html>
<head>
  <title>Student Grade Checker</title>
</head>
<body>
  <h2>Student Grade Checker</h2>
  <input type="number" id="marks" placeholder="Enter marks out of 100">
  <button id="checkGradeBtn">Check Grade</button>
  <p id="gradeResult"></p>

  <h2>Math Functions</h2>
  <button onclick="displaySum()">Show Sum</button>
  <p id="toggleText1"></p>

  <button onclick="displaySub()">Subtract</button>
  <p id="toggleText2"></p>

  <button onclick="displayMul()">Multiply</button>
  <p id="toggleText3"></p>

  <button onclick="displayDiv()">Divide</button>
  <p id="toggleText4"></p>

  <script src="assignment.js"></script>
  <script src="add.js"></script>
</body>
</html>
